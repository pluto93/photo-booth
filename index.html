<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edinburgh Photobooth</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Caveat:wght@600&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4efe6;
    --panel:#fffdf8;
    --ink:#1c3d5a;
    --accent:#1c3d5a;
    --accent2:#0f5c3f;
    --muted:#8a7f6f;
    --border:#d9cfbb;
    --slot:#2a2622;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1712;
      --panel:#25201a;
      --ink:#e7e2d6;
      --muted:#b3a894;
      --border:#3a3226;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1b1712;
    --panel:#25201a;
    --ink:#e7e2d6;
    --muted:#b3a894;
    --border:#3a3226;
  }
  * { box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family: 'Special Elite', monospace;
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
  }
  .wrap{ width:100%; max-width:960px; }
  h1{
    font-family: 'Special Elite', monospace;
    font-size:clamp(20px,3.4vw,28px);
    margin:0 0 4px;
    text-align:center;
    letter-spacing:0.5px;
    color:var(--muted);
    font-weight:normal;
  }
  .sub{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    margin:0 0 28px;
    line-height:1.5;
  }
  .layout{
    display:grid;
    grid-template-columns: 300px 1fr;
    gap:28px;
    align-items:start;
  }
  @media (max-width:720px){
    .layout{ grid-template-columns:1fr; }
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:20px;
  }
  label{
    display:block;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--muted);
    margin:16px 0 6px;
  }
  label:first-child{ margin-top:0; }
  input[type="text"]{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--bg);
    color:var(--ink);
    font-family:inherit;
    font-size:14px;
  }
  .upload-btn{
    display:block;
    width:100%;
    padding:12px;
    text-align:center;
    border:2px dashed var(--border);
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    color:var(--muted);
    transition:border-color .15s;
  }
  .upload-btn:hover{ border-color:var(--accent); color:var(--ink); }
  input[type="file"]{ display:none; }
  .thumbs{
    display:flex;
    gap:6px;
    margin-top:8px;
    flex-wrap:wrap;
  }
  .thumbs img{
    width:40px; height:40px; object-fit:cover;
    border-radius:5px;
    border:1px solid var(--border);
  }
  select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--bg);
    color:var(--ink);
    font-family:inherit;
    font-size:14px;
  }
  .btn{
    margin-top:20px;
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:var(--accent);
    color:#fff;
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    letter-spacing:0.3px;
  }
  .btn.secondary{
    background:transparent;
    color:var(--accent);
    border:1.5px solid var(--accent);
    margin-top:10px;
  }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn:hover:not(:disabled){ filter:brightness(1.08); }
  .preview-panel{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0;
  }
  .booth-mouth{
    width:100%;
    max-width:380px;
    height:26px;
    background:linear-gradient(180deg, #454038, var(--slot));
    border-radius:10px 10px 4px 4px;
    position:relative;
    box-shadow: inset 0 -4px 6px rgba(0,0,0,0.5), 0 2px 6px rgba(0,0,0,0.3);
    z-index:2;
  }
  .booth-mouth::after{
    content:'';
    position:absolute;
    left:8%; right:8%; bottom:6px;
    height:4px;
    background:#0a0908;
    border-radius:3px;
  }
  .print-viewport{
    width:100%;
    max-width:380px;
    height:700px;
    overflow:hidden;
    position:relative;
    background:transparent;
  }
  #canvas{
    width:100%;
    display:block;
    border-radius:0 0 4px 4px;
    box-shadow:0 10px 26px rgba(0,0,0,0.28);
    transform: translateY(-101%);
  }
  #canvas.printed{
    animation: printSlide 1.6s cubic-bezier(.25,.85,.35,1) forwards;
  }
  @keyframes printSlide{
    0%   { transform: translateY(-101%) rotate(0deg); }
    65%  { transform: translateY(1.5%) rotate(-0.6deg); }
    80%  { transform: translateY(-0.8%) rotate(0.4deg); }
    100% { transform: translateY(0%) rotate(0deg); }
  }
  .hint{
    font-size:12px;
    color:var(--muted);
    text-align:center;
    margin-top:12px;
  }
  .theme-toggle{
    position:fixed;
    top:16px;
    right:16px;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--ink);
    font-size:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
    z-index:10;
  }
  .theme-toggle:hover{ border-color:var(--accent); }
</style>
</head>
<body>
<button id="themeToggle" class="theme-toggle" aria-label="Toggle dark/light mode" title="Toggle dark/light mode">🌓</button>
<div class="wrap">
  <h1>Our city, forever in our memories &#9829;</h1>
  <p class="sub">I love you so much darling. Use this to always remember our first year in Edinburgh.<br>Upload up to four photos below, then watch your strip print out.</p>

  <div class="layout">
    <div class="panel">
      <label>Photos (up to 4)</label>
      <label class="upload-btn" id="uploadLabel">Click to choose photos</label>
      <input type="file" id="fileInput" accept="image/*" multiple>
      <div class="thumbs" id="thumbs"></div>

      <label>Title</label>
      <input type="text" id="topText" value="EDINBURGH" maxlength="60">

      <label>Bottom message</label>
      <input type="text" id="bottomText" value="Happy Anniversary" maxlength="40">

      <label>Small date / note line</label>
      <input type="text" id="dateText" value="est. this city, always ours" maxlength="40">

      <label>Frame style</label>
      <select id="styleSelect">
        <option value="mixed" selected>Classic strip (colour, sepia, mono)</option>
        <option value="colour">All colour</option>
        <option value="sepia">All sepia</option>
        <option value="mono">All black and white</option>
      </select>

      <button class="btn" id="printBtn" disabled>Print strip</button>
      <button class="btn secondary" id="downloadBtn" disabled>Download JPEG</button>
    </div>

    <div class="panel preview-panel">
      <div class="booth-mouth"></div>
      <div class="print-viewport">
        <canvas id="canvas" width="1024" height="1900"></canvas>
      </div>
      <p class="hint">Add your photos, then hit "Print strip" to watch it come out</p>
    </div>
  </div>
</div>

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;

frameImg.src = FRAME_SRC;

// slot boxes measured from the uploaded frame artwork (1024 wide native)
const SLOTS = [
  {x: 322, y: 265, w: 364, h: 234},
  {x: 322, y: 556, w: 364, h: 222},
  {x: 322, y: 837, w: 364, h: 221},
  {x: 322, y: 1111, w: 364, h: 208}
];
const FRAME_H = 1536;

uploadLabel.addEventListener('click', () => fileInput.click());

const themeToggle = document.getElementById('themeToggle');
let currentTheme = 'auto';
function applyTheme(theme){
  if (theme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    themeToggle.textContent = '☀️';
  } else if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeToggle.textContent = '🌙';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeToggle.textContent = '🌓';
  }
  currentTheme = theme;
}
themeToggle.addEventListener('click', () => {
  const order = ['auto', 'light', 'dark'];
  applyTheme(order[(order.indexOf(currentTheme) + 1) % order.length]);
});
applyTheme('auto');

fileInput.addEventListener('change', (e) => {
  const files = Array.from(e.target.files).slice(0, 4);
  if (!files.length) return;
  Promise.all(files.map(file => new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }))).then(imgs => {
    uploadedImgs = imgs;
    uploadLabel.textContent = imgs.length === 1 ? '1 photo selected' : imgs.length + ' photos selected';
    thumbsEl.innerHTML = '';
    imgs.forEach(img => {
      const t = document.createElement('img');
      t.src = img.src;
      thumbsEl.appendChild(t);
    });
    printBtn.disabled = false;
    downloadBtn.disabled = false;
    render();
  });
});

['topText','bottomText','dateText','styleSelect'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => render());
  document.getElementById(id).addEventListener('change', () => render());
});

function coverRect(img, targetW, targetH){
  const ir = img.width / img.height;
  const tr = targetW / targetH;
  let sw, sh, sx, sy;
  if (ir > tr) {
    sh = img.height;
    sw = sh * tr;
    sx = (img.width - sw) / 2;
    sy = 0;
  } else {
    sw = img.width;
    sh = sw / tr;
    sx = 0;
    sy = (img.height - sh) / 2;
  }
  return {sx, sy, sw, sh};
}

function makeFilteredTile(img, srcRect, destW, destH, mode){
  destW = Math.max(1, Math.round(destW));
  destH = Math.max(1, Math.round(destH));
  const off = document.createElement('canvas');
  off.width = destW; off.height = destH;
  const octx = off.getContext('2d');
  octx.drawImage(img, srcRect.sx, srcRect.sy, srcRect.sw, srcRect.sh, 0, 0, destW, destH);
  if (mode === 'colour') return off;
  const imgData = octx.getImageData(0, 0, destW, destH);
  const d = imgData.data;
  for (let p = 0; p < d.length; p += 4){
    const r = d[p], g = d[p+1], b = d[p+2];
    if (mode === 'mono'){
      const lum = 0.299*r + 0.587*g + 0.114*b;
      d[p] = d[p+1] = d[p+2] = lum;
    } else if (mode === 'sepia'){
      const nr = 0.393*r + 0.769*g + 0.189*b;
      const ng = 0.349*r + 0.686*g + 0.168*b;
      const nb = 0.272*r + 0.534*g + 0.131*b;
      d[p] = Math.min(255, nr);
      d[p+1] = Math.min(255, ng);
      d[p+2] = Math.min(255, nb);
    }
  }
  octx.putImageData(imgData, 0, 0);
  return off;
}

function modeFor(index, styleMode){
  if (styleMode === 'colour') return 'colour';
  if (styleMode === 'sepia') return 'sepia';
  if (styleMode === 'mono') return 'mono';
  const seq = ['colour', 'sepia', 'mono'];
  return seq[index % seq.length];
}

function wrapText(context, text, maxWidth){
  const words = text.split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  words.forEach(word => {
    const test = line ? line + ' ' + word : word;
    if (context.measureText(test).width > maxWidth && line){
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  });
  if (line) lines.push(line);
  return lines;
}

function ginghamStrip(x, y, w, h){
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  ctx.fillStyle = '#dbe6ef';
  ctx.fillRect(x, y, w, h);
  const cell = 12;
  ctx.fillStyle = '#4a6a8c';
  ctx.globalAlpha = 0.55;
  for (let i = 0; i < w / cell + 2; i++){
    if (i % 2 === 0) ctx.fillRect(x + i*cell, y, cell, h);
  }
  ctx.globalAlpha = 0.35;
  for (let j = 0; j < h / cell + 2; j++){
    if (j % 2 === 0) ctx.fillRect(x, y + j*cell, w, cell);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function render(){
  if (!frameReady) return;

  ctx.fillStyle = '#f4efe0';
  ctx.fillRect(0, 0, W, H);

  // header
  ctx.textAlign = 'center';
  const titleText = document.getElementById('topText').value || 'EDINBURGH';
  const titleMaxWidth = W - 140;
  let titleSize = 54;
  let titleLines;
  do {
    ctx.font = `700 ${titleSize}px 'Playfair Display', serif`;
    titleLines = wrapText(ctx, titleText, titleMaxWidth);
    titleSize -= 2;
  } while (titleLines.length > 2 && titleSize > 26);
  titleSize += 2;
  ctx.font = `700 ${titleSize}px 'Playfair Display', serif`;
  ctx.fillStyle = '#1c3d5a';
  const titleLineH = titleSize * 1.15;
  const titleBlockH = titleLines.length * titleLineH;
  const titleTop = (HEADER_H - titleBlockH) / 2 + titleSize * 0.78;
  titleLines.forEach((ln, idx) => {
    ctx.fillText(ln, W/2, titleTop + idx * titleLineH);
  });

  ginghamStrip(0, HEADER_H - 12, W, 12);

  // frame artwork
  ctx.drawImage(frameImg, 0, HEADER_H, W, FRAME_H);

  // photos into slots
  const styleMode = document.getElementById('styleSelect').value;
  const imgs = uploadedImgs;
  SLOTS.forEach((slot, i) => {
    const sy = HEADER_H + slot.y;
    if (imgs.length){
      const img = imgs[i % imgs.length];
      const {sx, sy: csy, sw, sh} = coverRect(img, slot.w, slot.h);
      const mode = modeFor(i, styleMode);
      const tile = makeFilteredTile(img, {sx, sy: csy, sw, sh}, slot.w, slot.h, mode);
      ctx.drawImage(tile, slot.x, sy, slot.w, slot.h);
    } else {
      ctx.fillStyle = '#efe8d8';
      ctx.fillRect(slot.x, sy, slot.w, slot.h);
      ctx.fillStyle = '#a89a80';
      ctx.font = "18px 'Special Elite', monospace";
      ctx.textAlign = 'center';
      ctx.fillText('upload a photo', slot.x + slot.w/2, sy + slot.h/2);
    }
  });

  // footer
  ginghamStrip(0, HEADER_H + FRAME_H, W, 12);

  const footerTop = HEADER_H + FRAME_H;
  ctx.textAlign = 'center';
  ctx.font = "600 46px 'Caveat', cursive";
  ctx.fillStyle = '#a8324c';
  const bottomText = document.getElementById('bottomText').value || '';
  const bottomLines = wrapText(ctx, bottomText, W - 220).slice(0, 2);
  const bottomLineH = 46;
  const bottomStartY = footerTop + 74 - (bottomLines.length - 1) * (bottomLineH/2);
  bottomLines.forEach((ln, idx) => {
    ctx.fillText(ln, W/2, bottomStartY + idx * bottomLineH);
  });

  ctx.font = "15px 'Special Elite', monospace";
  ctx.fillStyle = '#5c5344';
  const dateText = document.getElementById('dateText').value || '';
  const dateY = footerTop + 74 + bottomLines.length * bottomLineH + 8;
  ctx.fillText(dateText, W/2, dateY);

  ctx.font = "15px 'Special Elite', monospace";
  ctx.fillStyle = '#5c5344';
  ctx.fillText('From: Mansi, To: Aadhi', W/2, dateY + 34);
  ctx.fillText('18/09/2026', W/2, dateY + 58);
}

function triggerPrint(){
  render();
  canvas.classList.remove('printed');
  void canvas.offsetWidth;
  canvas.classList.add('printed');
}

printBtn.addEventListener('click', triggerPrint);

downloadBtn.addEventListener('click', async () => {
  render();
  canvas.toBlob(async (blob) => {
    if (!blob) return;
    let downloads = null;
    try {
      if (typeof claude !== 'undefined' && claude && claude.use) {
        downloads = await claude.use('downloads');
      }
    } catch (e) {
      downloads = null;
    }
    if (downloads) {
      try {
        await downloads.save({ filename: 'edinburgh-photobooth.jpg', data: blob });
      } catch (err) {
        if (err && err.code !== 'declined') {
          alert('Could not save the file: ' + (err.message || err.code));
        }
      }
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'edinburgh-photobooth.jpg';
    a.click();
    URL.revokeObjectURL(url);
  }, 'image/jpeg', 0.92);
});

render();
</script>
</body>
</html>
